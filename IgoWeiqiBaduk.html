		<script>
var nodeIdCounter = 0;

function Node(state, parent, move, moveNumber) {
    this.id = nodeIdCounter++; // Unique node ID
    this.state = state; // The board state at this node
    this.parent = parent; // The parent node
    this.children = []; // Array of child nodes
    this.move = move; // The move that led to this state
    this.moveNumber = moveNumber; // The move number at this node
}
var rootNode;
var currentNode;

function updateGameTreeView() {
    let gameTreeElement = document.getElementById('gameTree');
    gameTreeElement.innerHTML = '';
    buildGameTreeView(rootNode, gameTreeElement);
    // Force reflow
    gameTreeElement.style.display = 'none';
    gameTreeElement.offsetHeight; // Trigger a reflow
    gameTreeElement.style.display = '';
}

function buildGameTreeView(node, parentElement) {
    let li = document.createElement('li');
	li.textContent = node.moveNumber + (node.move ? ': ' + node.move.player + ' (' + node.move.x + ',' + node.move.y + ')' : ': Root');
    li.onclick = function () {
        event.stopPropagation(); // Prevent event bubbling
        currentNode = node;
        recalculateLiberties(currentNode.state);
        initLegalMoves(currentNode.state);
        updatePlayerToMove();
        redrawStones();
        redrawEffects();
        highlightSelectedNode();
    };

    li.setAttribute('data-node-id', node.id);

    parentElement.appendChild(li);

    if (node.children.length > 0) {
        let ul = document.createElement('ul');
        li.appendChild(ul);
        node.children.forEach(child => {
            buildGameTreeView(child, ul);
        });
    }
}

function highlightSelectedNode() {
    let selectedNodes = document.querySelectorAll('#gameTree li.selected');
    selectedNodes.forEach(node => node.classList.remove('selected'));

    let nodeElement = document.querySelector('#gameTree li[data-node-id="' + currentNode.id + '"]');
    if (nodeElement) {
        nodeElement.classList.add('selected');
    }
}

boardMarginWidth = 0.1;
gridLineWidth = 0.1;
gridRows = 1;
gridColumns = 1;

var playerIndicator = document.getElementById('playerIndicator');
var svgBoard = document.getElementById('svgBoard');
var svgBoardMargin = svgBoard.getElementById('boardmargin');
var svgBoardBoard = svgBoard.getElementById('board');
var svgBoardGrid = svgBoard.getElementById('grid');
var svgBoardStones = svgBoard.getElementById('stones');
var svgBoardNextMove = svgBoard.getElementById('nextMove');

var numberWidth = document.getElementById('width');
var numberHeight = document.getElementById('height');

var mouseMode = 'singleClickToMove';
// Add the red X to the board
let svgBoardIllegalMove = document.createElementNS('http://www.w3.org/2000/svg', 'g');
let line1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
let line2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');

// Configure the lines for the red X
line1.setAttribute('stroke', 'red');
line1.setAttribute('stroke-width', '0.1');  // Adjust thickness as needed
line2.setAttribute('stroke', 'red');
line2.setAttribute('stroke-width', '0.1');  // Adjust thickness as needed

svgBoardIllegalMove.appendChild(line1);
svgBoardIllegalMove.appendChild(line2);
svgBoard.appendChild(svgBoardIllegalMove);  // Add the X to the SVG

// Initially hide the red X
svgBoardIllegalMove.style.display = 'none';

svgBoard.onmousemove = function(e) {
    if (inScoringMode) {
        svgBoardNextMove.setAttribute('cx', -2);
        svgBoardNextMove.setAttribute('cy', -2);
        svgBoardIllegalMove.style.display = 'none';
        return;
    }

    let rect = svgBoard.getBoundingClientRect();

    // Determine the margin size (converted to pixel units)
    let marginSizeX = rect.width * boardMarginWidth / (gridColumns + 2 * boardMarginWidth);
    let marginSizeY = rect.height * boardMarginWidth / (gridRows + 2 * boardMarginWidth);

    // Calculate mouse position relative to the board, excluding the margin
    let mouseX = e.clientX - rect.left - marginSizeX;
    let mouseY = e.clientY - rect.top - marginSizeY;

    // Calculate grid positions within the playable board
    let boardWidth = rect.width - 2 * marginSizeX;
    let boardHeight = rect.height - 2 * marginSizeY;

    if (mouseX >= 0 && mouseX <= boardWidth && mouseY >= 0 && mouseY <= boardHeight) {
        let gridX = Math.floor(gridColumns * mouseX / boardWidth);
        let gridY = Math.floor(gridRows * mouseY / boardHeight);

        // Update the position of the phantom stone
        svgBoardNextMove.setAttribute('cx', gridX);
        svgBoardNextMove.setAttribute('cy', gridY);

        if (isIllegalMove(currentNode.state, gridX, gridY)) {
            // If the move is illegal, show the red X
            svgBoardIllegalMove.style.display = 'block';

            // Position the red X over the phantom stone
            line1.setAttribute('x1', gridX - 0.4);
            line1.setAttribute('y1', gridY - 0.4);
            line1.setAttribute('x2', gridX + 0.4);
            line1.setAttribute('y2', gridY + 0.4);

            line2.setAttribute('x1', gridX - 0.4);
            line2.setAttribute('y1', gridY + 0.4);
            line2.setAttribute('x2', gridX + 0.4);
            line2.setAttribute('y2', gridY - 0.4);
        } else {
            // If the move is legal, hide the red X
            svgBoardIllegalMove.style.display = 'none';
        }
    } else {
        // Mouse is outside the playable board, hide the phantom stone and the X
        svgBoardNextMove.setAttribute('cx', -2);
        svgBoardNextMove.setAttribute('cy', -2);
        svgBoardIllegalMove.style.display = 'none';
    }
};

svgBoard.onmouseout = function(e) {
    svgBoardNextMove.setAttribute('cx', -2);
    svgBoardNextMove.setAttribute('cy', -2);
    svgBoardIllegalMove.style.display = 'none';
};

// Double-click to place stones
svgBoard.ondblclick = function(e) {
    if (inScoringMode) return;

    let rect = svgBoard.getBoundingClientRect();

    // Determine the margin size (converted to pixel units)
    let marginSizeX = rect.width * boardMarginWidth / (gridColumns + 2 * boardMarginWidth);
    let marginSizeY = rect.height * boardMarginWidth / (gridRows + 2 * boardMarginWidth);

    // Calculate mouse position relative to the board, excluding the margin
    let mouseX = e.clientX - rect.left - marginSizeX;
    let mouseY = e.clientY - rect.top - marginSizeY;

    // Calculate grid positions within the playable board
    let boardWidth = rect.width - 2 * marginSizeX;
    let boardHeight = rect.height - 2 * marginSizeY;

    if (mouseX >= 0 && mouseX <= boardWidth && mouseY >= 0 && mouseY <= boardHeight) {
        let gridX = Math.floor(gridColumns * mouseX / boardWidth);
        let gridY = Math.floor(gridRows * mouseY / boardHeight);

        if (!isIllegalMove(currentNode.state, gridX, gridY) && mouseMode === 'doubleClickToMove') {
            guiPlayMove(gridX, gridY);
        }
    }
};

// Single-click to place stones
svgBoard.onclick = function(e) {
    if (inScoringMode) return;

    let rect = svgBoard.getBoundingClientRect();

    // Determine the margin size (converted to pixel units)
    let marginSizeX = rect.width * boardMarginWidth / (gridColumns + 2 * boardMarginWidth);
    let marginSizeY = rect.height * boardMarginWidth / (gridRows + 2 * boardMarginWidth);

    // Calculate mouse position relative to the board, excluding the margin
    let mouseX = e.clientX - rect.left - marginSizeX;
    let mouseY = e.clientY - rect.top - marginSizeY;

    // Calculate grid positions within the playable board
    let boardWidth = rect.width - 2 * marginSizeX;
    let boardHeight = rect.height - 2 * marginSizeY;

    if (mouseX >= 0 && mouseX <= boardWidth && mouseY >= 0 && mouseY <= boardHeight) {
        let gridX = Math.floor(gridColumns * mouseX / boardWidth);
        let gridY = Math.floor(gridRows * mouseY / boardHeight);

        if (!isIllegalMove(currentNode.state, gridX, gridY) && mouseMode === 'singleClickToMove') {
            guiPlayMove(gridX, gridY);
        }
    }
};

document.getElementById('sgfInput').addEventListener('change', function(event) {
    var file = event.target.files[0];
    if (file) {
        var reader = new FileReader();
        reader.onload = function(e) {
            var sgfContent = e.target.result;
            importFromSGF(sgfContent);
        };
        reader.readAsText(file);
    }
});

function parseSGF(sgfContent) {
    sgfContent = sgfContent.replace(/\s+/g, '');
    var index = 0;
    var length = sgfContent.length;
    function parseCollection() {
        var collection = [];
        while (index < length) {
            if (sgfContent[index] === '(') {
                index++;
                collection.push(parseGameTree());
            } else {
                index++;
            }
        }
        return collection;
    }
    function parseGameTree() {
        var sequence = parseSequence();
        var subtrees = [];
        while (index < length && sgfContent[index] === '(') {
            index++;
            subtrees.push(parseGameTree());
        }
        if (index < length && sgfContent[index] === ')') {
            index++;
        }
        return { sequence: sequence, subtrees: subtrees };
    }
    function parseSequence() {
        var nodes = [];
        while (index < length && sgfContent[index] === ';') {
            nodes.push(parseNode());
        }
        return nodes;
    }
    function parseNode() {
        var properties = {};
        index++;
        while (index < length && /[A-Z]/.test(sgfContent[index])) {
            var property = parseProperty();
            properties[property.ident] = property.values;
        }
        return properties;
    }
    function parseProperty() {
        var ident = '';
        while (index < length && /[A-Z]/.test(sgfContent[index])) {
            ident += sgfContent[index];
            index++;
        }
        var values = [];
        while (index < length && sgfContent[index] === '[') {
            values.push(parsePropValue());
        }
        return { ident: ident, values: values };
    }
    function parsePropValue() {
        index++;
        var value = '';
        while (index < length && sgfContent[index] !== ']') {
            if (sgfContent[index] === '\\') {
                index++;
                if (index < length) {
                    value += sgfContent[index];
                    index++;
                }
            } else {
                value += sgfContent[index];
                index++;
            }
        }
        index++;
        return value;
    }
    return parseCollection();
}

function charToInt(c) {
    if (c >= 'a' && c <= 'z') {
        return c.charCodeAt(0) - 'a'.charCodeAt(0);
    } else if (c >= 'A' && c <= 'Z') {
        return c.charCodeAt(0) - 'A'.charCodeAt(0) + 26;
    } else {
        return null;
    }
}

function convertSGFCoordToXY(coord) {
    if (coord.length !== 2) {
        return null;
    }
    var x = charToInt(coord[0]);
    var y = charToInt(coord[1]);
    if (x === null || y === null) {
        return null;
    }
    return { x: x, y: y };
}

function importFromSGF(sgfContent) {
    try {
		// Clear existing game data
		nodeIdCounter = 0;
		rootNode = null;
		currentNode = null;

        var sgfCollection = parseSGF(sgfContent);
        if (sgfCollection.length > 0) {
            var gameTree = sgfCollection[0];
            initializeGameFromSGFTree(gameTree);
            updatePlayerToMove();
            redrawStones();
            redrawEffects();
        } else {
            console.log('No valid SGF game trees found.');
        }
    } catch (e) {
        console.error('Error parsing SGF:', e);
    }
}

function initializeGameFromSGFTree(gameTree) {
    var rootNodeProperties = gameTree.sequence[0];
    // Adjust the board size based on SZ property
    var sizeProp = rootNodeProperties['SZ'];
    if (sizeProp && sizeProp.length > 0) {
        var size = sizeProp[0];
        var sizes = size.split(':');
        if (sizes.length === 2) {
            gridColumns = parseInt(sizes[0]);
            gridRows = parseInt(sizes[1]);
        } else {
            gridColumns = gridRows = parseInt(size);
        }
    } else {
        gridColumns = gridRows = 19;
    }
    resizeSvgBoard(); // Resize the SVG board
    
    // Initialize the initial state
    let initialState = {
        boardText: [],
        legalMove: [],
        groupId: [],
        koY: -1,
        koX: -1,
        groupLibertySet: new Map(),
        groupStoneSet: new Map(),
        playerToMove: 'X'
    };
    
    for (var y = 0; y < gridRows; y++) {
        initialState.boardText[y] = [];
        for (var x = 0; x < gridColumns; x++) {
            initialState.boardText[y][x] = '.';
        }
    }
    
    // Handle initial stones
    var abProp = rootNodeProperties['AB'];
    if (abProp) {
        abProp.forEach(coord => {
            var xy = convertSGFCoordToXY(coord);
            if (xy) {
                initialState.boardText[xy.y][xy.x] = 'X';
            }
        });
    }
    var awProp = rootNodeProperties['AW'];
    if (awProp) {
        awProp.forEach(coord => {
            var xy = convertSGFCoordToXY(coord);
            if (xy) {
                initialState.boardText[xy.y][xy.x] = 'O';
            }
        });
    }
    
    initLegalMoves(initialState);
    recalculateLiberties(initialState);
    
    rootNode = new Node(initialState, null, null, 0);
    currentNode = rootNode;
    
    // Redraw the board
    redrawStones();
    redrawEffects();
    updatePlayerToMove();

    // Start processing the main line
    processMainLine(gameTree, rootNode);

    // Now that the game tree is fully built, update the GUI
    updateGameTreeView();
    highlightSelectedNode();
}

function processMainLine(gameTree, parentNode) {
    var currentParent = parentNode;
    var sequenceStartIndex = (currentParent === rootNode) ? 1 : 0;
    for (var i = sequenceStartIndex; i < gameTree.sequence.length; i++) {
        var nodeProperties = gameTree.sequence[i];
        var moveData = extractMoveFromNode(nodeProperties);
        let newState = copyState(currentParent.state);
        recalculateLiberties(newState);
        initLegalMoves(newState);
        if (moveData.move) {
            newState.playerToMove = moveData.move.player;
            playMove(newState, moveData.move.x, moveData.move.y, false, false);
        } else if (moveData.pass) {
            newState.playerToMove = moveData.pass.player;
        }
        newState.playerToMove = switchPlayer2(newState.playerToMove);
        let newNode = new Node(newState, currentParent, moveData.move || moveData.pass, currentParent.moveNumber + 1);
        currentParent.children.push(newNode);
        currentParent = newNode;
    }
    if (gameTree.subtrees.length > 0) {
        processMainLine(gameTree.subtrees[0], currentParent);
        for (var i = 1; i < gameTree.subtrees.length; i++) {
            processSubtree(gameTree.subtrees[i], currentParent);
        }
    }
}

function extractMoveFromNode(nodeProperties) {
    var move = null;
    var player = null;
    if (nodeProperties['B']) {
        player = 'X';
        var coord = nodeProperties['B'][0];
        move = createMoveFromCoord(coord, player);
    } else if (nodeProperties['W']) {
        player = 'O';
        var coord = nodeProperties['W'][0];
        move = createMoveFromCoord(coord, player);
    }
    if (move === null) {
        // Handle pass move
        move = { x: -1, y: -1, player: player };
    }
    return { move: move };
}

function createMoveFromCoord(coord, player) {
    if (coord === '') {
        // Pass move
        return { x: -1, y: -1, player: player };
    } else {
        var xy = convertSGFCoordToXY(coord);
        if (xy) {
            return { x: xy.x, y: xy.y, player: player };
        }
    }
    return null;
}

function processSubtree(gameTree, parentNode) {
    var currentParent = parentNode;

    // Process the sequence of moves in the variation
    processSequence(gameTree.sequence, currentParent);

    // Recursively process any sub-variations
    gameTree.subtrees.forEach(subtree => {
        processSubtree(subtree, currentParent);
    });
}

function processSequence(sequence, parentNode) {
    var currentParent = parentNode;

    sequence.forEach(nodeProperties => {
        var moveData = extractMoveFromNode(nodeProperties);

        let newState = JSON.parse(JSON.stringify(currentParent.state));
        recalculateLiberties(newState);
        initLegalMoves(newState);

        if (moveData.move) {
            newState.playerToMove = moveData.move.player;
            playMove(newState, moveData.move.x, moveData.move.y, false, false);
        } else if (moveData.pass) {
            newState.playerToMove = moveData.pass.player;
        }

        // Switch player
        newState.playerToMove = switchPlayer2(newState.playerToMove);

        let newNode = new Node(newState, currentParent, moveData.move || moveData.pass, currentParent.moveNumber + 1);
        currentParent.children.push(newNode);
        currentParent = newNode;
    });
}

function createEmptyState() {
    let state = {
        boardText: [],
        legalMove: [],
        groupId: [],
        koY: -1,
        koX: -1,
        groupLibertySet: new Map(),
        groupStoneSet: new Map(),
        playerToMove: 'X'
    };

    for (var y = 0; y < gridRows; y++) {
        state.boardText[y] = [];
        for (var x = 0; x < gridColumns; x++) {
            state.boardText[y][x] = '.';
        }
    }

    return state;
}

function copyState(oldState) {
    let newState = {
        boardText: [],
        legalMove: [],
        groupId: [],
        koY: oldState.koY,
        koX: oldState.koX,
        groupLibertySet: new Map(),
        groupStoneSet: new Map(),
        playerToMove: oldState.playerToMove
    };
    var numRows = oldState.boardText.length;
    var numCols = oldState.boardText[0].length;
    for (var y = 0; y < numRows; y++) {
        newState.boardText[y] = [];
        newState.legalMove[y] = [];
        newState.groupId[y] = [];
        for (var x = 0; x < numCols; x++) {
            newState.boardText[y][x] = oldState.boardText[y][x];
            newState.legalMove[y][x] = '?';
            newState.groupId[y][x] = '';
        }
    }
    return newState;
}

function intToChar(n) {
    if (n >= 0 && n <= 25) {
        // 'a' to 'z' for indices 0 to 25
        return String.fromCharCode('a'.charCodeAt(0) + n);
    } else if (n >= 26 && n <= 51) {
        // 'A' to 'Z' for indices 26 to 51
        return String.fromCharCode('A'.charCodeAt(0) + n - 26);
    } else {
        throw new Error('Coordinate out of range for SGF (max 52x52 board size)');
    }
}

function convertCoordinatesToSGF(x, y) {
    const sgfX = intToChar(x);
    const sgfY = intToChar(y);
    return sgfX + sgfY;
}

function exportToSGF() {
    let sgfContent = generateSGF(rootNode);
    // Create a blob and initiate download
    let blob = new Blob([sgfContent], {type: 'application/x-go-sgf'});
    let link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'CurvyConnectedDangoGoGui'+Date.now()+'.sgf';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function generateSGF(node) {
    let sgf = '';
    sgf += '('; // Start of variation

    if (node.parent === null) {
        // Root node properties
        sgf += ';';
        sgf += 'FF[4]'; // File format version
        sgf += 'GM[1]'; // Game type (1 = Go)
        sgf += 'CA[UTF-8]'; // Unicode format
        sgf += 'AP[CurvyConnectedDangoGoGui]'; // Application name

        // Adjust the board size property for rectangular boards
        if (gridColumns === gridRows) {
            sgf += 'SZ[' + gridColumns + ']'; // Square board
        } else {
            sgf += 'SZ[' + gridColumns + ':' + gridRows + ']'; // Rectangular board
        }

        // Collect initial stones
        let blackStones = [];
        let whiteStones = [];
        for (let y = 0; y < gridRows; y++) {
            for (let x = 0; x < gridColumns; x++) {
                let stone = node.state.boardText[y][x];
                if (stone === 'X') {
                    blackStones.push(convertCoordinatesToSGF(x, y));
                } else if (stone === 'O') {
                    whiteStones.push(convertCoordinatesToSGF(x, y));
                }
            }
        }

        // Add initial stones to SGF
        if (blackStones.length > 0) {
            sgf += 'AB';
            blackStones.forEach(coord => {
                sgf += '[' + coord + ']';
            });
        }
        if (whiteStones.length > 0) {
            sgf += 'AW';
            whiteStones.forEach(coord => {
                sgf += '[' + coord + ']';
            });
        }

        // You can add more properties like player names, etc.
    } else {
        // Add move
        sgf += ';';
        let move = node.move;
        let moveStr = '';
        if (move.player === 'X') {
            moveStr += 'B';
        } else if (move.player === 'O') {
            moveStr += 'W';
        }
        if (move.x >= 0 && move.y >= 0) {
            let coords = convertCoordinatesToSGF(move.x, move.y);
            moveStr += '[' + coords + ']';
        } else {
            // Pass move
            moveStr += '[]';
        }
        sgf += moveStr;
    }

    if (node.children.length > 0) {
        if (node.children.length === 1) {
            // Continue the main line without starting a new variation
            sgf += generateSGF(node.children[0]).slice(1, -1); // Remove outer parentheses
        } else {
            // Multiple variations
            for (let child of node.children) {
                sgf += generateSGF(child);
            }
        }
    }

    sgf += ')'; // End of variation
    return sgf;
}

function guiPlayMove(x, y) {
    x = Math.floor(x);
    y = Math.floor(y);
    if (!isIllegalMove(currentNode.state, x, y)) {
        // Check if the move already exists in the children
        let existingChild = currentNode.children.find(child => {
            return child.move && child.move.x === x && child.move.y === y;
        });

        if (existingChild) {
            // Move to the existing child
            currentNode = existingChild;
        } else {
            // Create a new state by copying the current state
            let newState = JSON.parse(JSON.stringify(currentNode.state));
            recalculateLiberties(newState);
            playMove(newState, x, y, false);
            initLegalMoves(newState);

            // Create a new node and add it as a child
            let newNode = new Node(newState, currentNode, { x: x, y: y, player: currentNode.state.playerToMove }, currentNode.moveNumber + 1);
            currentNode.children.push(newNode);
            currentNode = newNode;
        }

        updatePlayerToMove();
        redrawStones();
        redrawEffects();
    } else {
        console.log('Illegal move.');
    }

    updateGameTreeView();
    highlightSelectedNode();
}

function playMove(state, x, y, updateGui, doSwitchPlayer = true) {
    x = Math.floor(x);
    y = Math.floor(y);
    var numRows = state.boardText.length;
    var numCols = state.boardText[0].length;
    state.koY = -1;
    state.koX = -1;
    setVertex(state, x, y, state.playerToMove);
    if (updateGui) {
        drawSvgStoneWithEffects(x, y);
    }
    var vertex = x + '_' + y;
    state.groupStoneSet[vertex] = new Set([vertex]);
    state.groupLibertySet[vertex] = new Set();

    // Initialize groupId array if necessary
    if (!state.groupId[y]) {
        state.groupId[y] = [];
    }
    state.groupId[y][x] = vertex;

    // Define directions for adjacent positions
    const directions = [
        { dx: 1, dy: 0 },
        { dx: -1, dy: 0 },
        { dx: 0, dy: 1 },
        { dx: 0, dy: -1 }
    ];

    // Add liberties to the new group
    directions.forEach(({ dx, dy }) => {
        let nx = x + dx;
        let ny = y + dy;
        if (getVertex(state, nx, ny) === '.') {
            state.groupLibertySet[vertex].add(nx + '_' + ny);
        }
    });

    // Merge with adjacent friendly groups
    directions.forEach(({ dx, dy }) => {
        let nx = x + dx;
        let ny = y + dy;
        mergeGroups(state, nx, ny, vertex);
    });

    // Subtract liberties from adjacent enemy groups and check for captures
    directions.forEach(({ dx, dy }) => {
        let nx = x + dx;
        let ny = y + dy;
        subtractLiberty(state, nx, ny, vertex, updateGui);
    });

    if (doSwitchPlayer) {
        switchPlayer(state);
    }
}

function updatePlayerToMove() {
	switch (currentNode.state.playerToMove) {
		case 'X':
			svgBoardNextMove.setAttribute('class', 'player1');
			playerIndicator.innerHTML='1';
			break;
		case 'O':
			svgBoardNextMove.setAttribute('class', 'player2');
			playerIndicator.innerHTML='2';
			break;
	}
}

function pass() {
	cutOffExtraStates();
	boardStates.push(JSON.parse(JSON.stringify(currentNode.state)));
	stateIndex++;
	recalculateLiberties(currentNode.state);
	initLegalMoves(currentNode.state);
	currentNode.state.koY=-1;
	switchPlayer(currentNode.state);
	updatePlayerToMove();
	svgBoardNextMove.setAttribute('cy', -3);
}

function mergeGroups(state, x, y, id2) {
    x = Math.floor(x);
    y = Math.floor(y);
    var numRows = state.boardText.length;
    var numCols = state.boardText[0].length;
    if ((numCols <= x) || (x < 0) || (numRows <= y) || (y < 0)) return;
    let currentVertex = getVertex(state, x, y);
    let id2Coords = id2.split('_');
    let id2X = parseInt(id2Coords[0]);
    let id2Y = parseInt(id2Coords[1]);
    if (currentVertex === '.' || currentVertex === 'E') return;
    if (currentVertex == getVertex(state, id2X, id2Y)) {
        let gid = state.groupId[y][x];
        id2 = state.groupId[id2Y][id2X];
        if (gid !== id2) {
            for (let stone of state.groupStoneSet[id2]) {
                state.groupStoneSet[gid].add(stone);
                let [stoneX, stoneY] = stone.split('_').map(Number);
                state.groupId[stoneY][stoneX] = gid;
            }
            state.groupStoneSet.delete(id2);
            for (let liberty of state.groupLibertySet[id2]) {
                state.groupLibertySet[gid].add(liberty);
            }
            state.groupLibertySet.delete(id2);
        }
    }
}

var captureMode = 'removeStones';

function subtractLiberty(state, x, y, vertex, updateGui) {
    x = Math.floor(x);
    y = Math.floor(y);
    if ((state.boardText[0].length <= x) || (x < 0) || (state.boardText.length <= y) || (y < 0)) return;

    let currentVertex = getVertex(state, x, y);
    if (currentVertex === '.' || currentVertex === 'E') return;

    let gid = state.groupId[y][x]; // Captured group's ID
    state.groupLibertySet[gid].delete(vertex);

    // Check for capture
    if (currentVertex !== state.playerToMove && getVertexLibertyAmount(state, x, y) === 0) {
        let capturedGroupSize = state.groupStoneSet[gid].size;

        // Get the capturing stone's coordinates from vertex
        let [capturingStoneX, capturingStoneY] = vertex.split('_').map(Number);
        let capturingGroupId = state.groupId[capturingStoneY][capturingStoneX];
        let capturingGroupSize = state.groupStoneSet[capturingGroupId].size;

        if (capturedGroupSize === 1 && capturingGroupSize === 1) {
            state.koX = x;
            state.koY = y;
        }

        // Capture the stones
        for (let stone of state.groupStoneSet[gid]) {
            let [stoneX, stoneY] = stone.split('_').map(Number);
            setVertex(state, stoneX, stoneY, '.');
            if (updateGui) {
                removeSvgStone(stoneX, stoneY);
            }
            // Remove stone from groupId
            state.groupId[stoneY][stoneX] = '';
        }
        // After removal, update liberties of neighboring groups
        for (let stone of state.groupStoneSet[gid]) {
            let [stoneX, stoneY] = stone.split('_').map(Number);
            addLiberty(state, stoneX, stoneY);
        }
        state.groupLibertySet.delete(gid);
        state.groupStoneSet.delete(gid);
    }
}

function removeSvgStone(x,y) {
	x=Math.floor(x);
	y=Math.floor(y);
	for (e of svgBoard.querySelectorAll('.vertex'+x+'_'+y)){
		e.parentElement.removeChild(e);
	}
}

function drawSvgStoneWithEffects(x,y) {
	x=Math.floor(x);
	y=Math.floor(y);
	if((gridColumns<=x)||(x<0)||(gridRows<=y)||(y<0))
		return;
	removeSvgStone(x,y);
	if (getCurVertex(x, y) != '.') {
		newStone = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
		newStone.setAttribute('cx', x);
		newStone.setAttribute('cy', y);
		newStone.setAttribute('r', 0.5);
		targetClass='vertex'+x+'_'+y;
		switch (getCurVertex(x, y)) {
			case 'X':
				newStone.setAttribute('class', targetClass+' player1');
				break;
			case 'O':
				newStone.setAttribute('class', targetClass+' player2');
		}
		svgBoardStones.appendChild(newStone);
	}
	drawHorizontalRectEffect(x-1,y);
	drawHorizontalRectEffect(x,y);
	drawVerticalRectEffect(x,y-1);
	drawVerticalRectEffect(x,y);
	drawCompare3Effect(x-1,y);
	drawCompare3Effect(x,y);
	drawCompare3Effect(x-1,y-1);
	drawCompare3Effect(x,y-1);
}

function addLiberty(state, x, y) {
	x=Math.floor(x);
	y=Math.floor(y);
	if((gridColumns<=x)||(x<0)||(gridRows<=y)||(y<0))
		return;
	addLiberty2(state, 1+x, y,x+'_'+y);
	addLiberty2(state, -1+x, y,x+'_'+y);
	addLiberty2(state, x, 1+y,x+'_'+y);
	addLiberty2(state, x, -1+y,x+'_'+y);
}

function addLiberty2(state, x, y, vertex) {
	x=Math.floor(x);
	y=Math.floor(y);
	if((gridColumns<=x)||(x<0)||(gridRows<=y)||(y<0))
		return;
	switch(getVertex(state, x, y)){
		case '.':
		case 'E':
			return;
	}
	state.groupLibertySet[state.groupId[y][x]].add(vertex);
}

function switchPlayer(state) {
	state.playerToMove = switchPlayer2(state.playerToMove);
}

function switchPlayer2(s) {
	switch (s) {
		case 'X':
			return 'O';
		case 'O':
			return 'X';
	}
	return 'E';
}

function isIllegalMove(state, x, y) {
	x=Math.floor(x);
	y=Math.floor(y);
	switch (state.legalMove[y][x]) {
		case 'i':
			return true;
		case 'l':
			return false;
	}
	if (x == state.koX && y == state.koY) {
		state.legalMove[y][x] = 'i';
		return true;
	}
	if (getVertex(state, x, y) != '.') {
		state.legalMove[y][x] = 'i';
		return true;
	}
	//Simulate move
	simState = JSON.parse(JSON.stringify(state));
	recalculateLiberties(simState);
	playMove(simState, x, y, false);
	recalculateLiberties(simState);
	if (getVertexLibertyAmount(simState, x, y) === 0) {
		return true;
	}
	return false;
}

function getVertex(state, x, y) {
    x = Math.floor(x);
    y = Math.floor(y);
    if ((typeof y === 'undefined') || (typeof x === 'undefined'))
        return 'E';
    var numRows = state.boardText.length;
    var numCols = state.boardText[0].length;
    if (0 <= x && x < numCols && 0 <= y && y < numRows) {
        return state.boardText[y][x];
    }
    return 'E';
}

function setVertex(state, x, y, char) {
	x=Math.floor(x);
	y=Math.floor(y);
	//console.log('setVertex', x, y, char);
    var numRows = state.boardText.length;
    var numCols = state.boardText[0].length;
	if (0 <= x && x < numCols && 0 <= y && y < numRows) {
		state.boardText[y][x] = char;
	}
}

function getVertexLibertyAmount(state, x, y) {
	x=Math.floor(x);
	y=Math.floor(y);
	//for convenience, empty vertices will also have liberties.
	if (0 <= x && x < gridColumns && 0 <= y && y < gridRows) {
		if (getVertex(state, x, y)!='.') {
			return state.groupLibertySet[state.groupId[y][x]].size;
		}
	}
	return -1;
}

var boardStates = [];
var stateIndex = -1;

function undo() {
    if (currentNode.parent) {
        currentNode = currentNode.parent;
        updatePlayerToMove();
        redrawStones();
        redrawEffects();
    }

    updateGameTreeView();
    highlightSelectedNode();
}

function initBoardWithText(boardTextTemp) {
	boardStates = [{boardText:[], legalMove:[], groupId:[], koY:-1, koX:-1,
			groupLibertySet:new Map(), groupStoneSet:new Map()}];
	stateIndex = 0;
	//Input of GNU Go style expected (also used by Leela Zero)
	boardTextTemp = boardTextTemp.split('+').join('.');
	index = 0;
	while (index < boardTextTemp.length) {
		switch (boardTextTemp[index]) {
			case '.':
			case 'X':
			case 'O':
			case '\n':
				index++;
				break;
			default:
				boardTextTemp = boardTextTemp.substring(0, index) + boardTextTemp.substring(index + 1);
		}
	}
	boardTextTemp = boardTextTemp.trim().split('\n');
	maxRowLength = 0;
	for (row of boardTextTemp){
		maxRowLength=Math.max(maxRowLength,row.length);
	}
	if (maxRowLength==0)
		return;
	goodRows = 0;
	for (row of boardTextTemp){
		if(maxRowLength==row.length) {
			boardStates[0].boardText[goodRows] = row.split('');
			goodRows++;
		}
	}
	if (gridRows != goodRows || gridColumns != maxRowLength) {
		gridRows = goodRows;
		gridColumns = maxRowLength;
		console.log('Detected board size change', gridRows, gridColumns);
		resizeSvgBoard();
	}
    let initialState = {
        boardText: boardStates[0].boardText,
        legalMove: [],
        groupId: boardStates[0].groupId,
        koY: -1,
        koX: -1,
        groupLibertySet: boardStates[0].groupLibertySet,
        groupStoneSet: boardStates[0].groupStoneSet,
        playerToMove: 'X'
    };

    // Initialize legal moves and recalculate liberties
    initLegalMoves(initialState);
    recalculateLiberties(initialState);

    rootNode = new Node(initialState, null, null, 0);
    currentNode = rootNode;

    updatePlayerToMove();
    redrawStones();
    redrawEffects();
    updateGameTreeView();
    highlightSelectedNode();
}

	for (row of currentNode.state.boardText) {

function freshBoard() {
    eastWest = Math.ceil(numberWidth.value);
    northSouth = Math.ceil(numberHeight.value);
    if (gridRows != northSouth || gridColumns != eastWest) {
        gridRows = northSouth;
        gridColumns = eastWest;
        console.log('Detected board size change', gridRows, gridColumns);
        resizeSvgBoard();
    }

    let initialState = {
        boardText: [],
        legalMove: [],
        groupId: [],
        koY: -1,
        koX: -1,
        groupLibertySet: new Map(),
        groupStoneSet: new Map(),
        playerToMove: 'X'
    };

    for (var y = 0; y < gridRows; y++) {
        initialState.boardText[y] = [];
        for (var x = 0; x < gridColumns; x++) {
            initialState.boardText[y][x] = '.';
        }
    }

    initLegalMoves(initialState);
    recalculateLiberties(initialState);

    rootNode = new Node(initialState, null, null, 0);
    currentNode = rootNode;

    redrawStones();
    redrawEffects();
    updatePlayerToMove();
    updateGameTreeView();
    highlightSelectedNode();
}

function initLegalMoves(state) {
	for (var y = 0; y < gridRows; y++) {
		state.legalMove[y] = [];
		for (var x = 0; x < gridColumns; x++) {
			state.legalMove[y][x] = '?';
		}
	}
}

function paintGroupId(state, x, y, id) {
    x = Math.floor(x);
    y = Math.floor(y);
    var numRows = state.boardText.length;
    var numCols = state.boardText[0].length;
    if ((numCols <= x) || (x < 0) || (numRows <= y) || (y < 0)) return;
    if (getVertex(state, x, y) === '.' || getVertex(state, x, y) === 'E') return;
    
    state.groupId[y][x] = id;
    state.groupStoneSet[id].add(x + '_' + y);
    
    // Check adjacent positions
    const directions = [
        { dx: 1, dy: 0 },
        { dx: -1, dy: 0 },
        { dx: 0, dy: 1 },
        { dx: 0, dy: -1 }
    ];
    
    directions.forEach(({ dx, dy }) => {
        let nx = x + dx;
        let ny = y + dy;
        if (getVertex(state, nx, ny) === '.') {
            state.groupLibertySet[id].add(nx + '_' + ny);
        } else if (getVertex(state, nx, ny) === getVertex(state, x, y)) {
            if (state.groupId[ny][nx] !== id) {
                paintGroupId(state, nx, ny, id);
            }
        }
    });
}

function recalculateLiberties(state) {
    state.groupId = [];
    state.groupLibertySet = new Map();
    state.groupStoneSet = new Map();
    var numRows = state.boardText.length;
    var numCols = state.boardText[0].length;
    for (var y = 0; y < numRows; y++) {
        state.groupId[y] = new Array(numCols).fill('');
    }
    for (var y = 0; y < numRows; y++) {
        for (var x = 0; x < numCols; x++) {
            if ((getVertex(state, x, y) != '.') && (state.groupId[y][x] === '')) {
                state.groupStoneSet[x + '_' + y] = new Set();
                state.groupLibertySet[x + '_' + y] = new Set();
                paintGroupId(state, x, y, x + '_' + y);
            }
        }
    }
}

function redrawStones() {
	while (svgBoardStones.lastChild) {
		svgBoardStones.removeChild(svgBoardStones.lastChild);
	}
	for (var x = 0; x < gridColumns; x++) {
		for (var y = 0; y < gridRows; y++) {
			drawSvgStone(x,y);
		}
	}
}

function getCurVertex(x, y) {
	return getVertex(currentNode.state, x, y);
}

function drawSvgStone(x,y) {
	x=Math.floor(x);
	y=Math.floor(y);
	if((gridColumns<=x)||(x<0)||(gridRows<=y)||(y<0))
		return;
	if (getCurVertex(x, y) != '.') {
		newStone = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
		newStone.setAttribute('cx', x);
		newStone.setAttribute('cy', y);
		newStone.setAttribute('r', 0.5);
		targetClass='vertex'+x+'_'+y;
		switch (getCurVertex(x, y)) {
			case 'X':
				newStone.setAttribute('class', targetClass+' player1');
				break;
			case 'O':
				newStone.setAttribute('class', targetClass+' player2');
		}
		svgBoardStones.appendChild(newStone);
	}
}

function drawHorizontalRectEffect(x,y) {
	x=Math.floor(x);
	y=Math.floor(y);
	if((gridColumns-1<=x)||(x<0)||(gridRows<=y)||(y<0))
		return;
	if ((getCurVertex(x, y) != '.') && (getCurVertex(x + 1, y) != '.')) {
		newCompare2 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
		newCompare2.setAttribute('x', x);
		newCompare2.setAttribute('y', y - 0.5);
		newCompare2.setAttribute('width', 1);
		newCompare2.setAttribute('height', 1);
		targetClass='vertex'+x+'_'+y+' vertex'+(x+1)+'_'+y;
		if (getCurVertex(x, y) == getCurVertex(x + 1, y)) {
			switch (getCurVertex(x, y)) {
				case 'X':
					newCompare2.setAttribute('class', targetClass+' player1');
					break;
				case 'O':
					newCompare2.setAttribute('class', targetClass+' player2');
			}
			same2.appendChild(newCompare2);
		} else {
			newCompare2.setAttribute('class', targetClass+' conflict');
			different2.appendChild(newCompare2);
		}
	}
}

function drawVerticalRectEffect(x,y) {
	x=Math.floor(x);
	y=Math.floor(y);
	if((gridColumns<=x)||(x<0)||(gridRows-1<=y)||(y<0))
		return;
	if ((getCurVertex(x, y) != '.') && (getCurVertex(x, y + 1) != '.')) {
		newCompare2 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
		newCompare2.setAttribute('x', x - 0.5);
		newCompare2.setAttribute('y', y);
		newCompare2.setAttribute('width', 1);
		newCompare2.setAttribute('height', 1);
		targetClass='vertex'+x+'_'+y+' vertex'+x+'_'+(y+1);
		if (getCurVertex(x, y) == getCurVertex(x, y + 1)) {
			switch (getCurVertex(x, y)) {
				case 'X':
					newCompare2.setAttribute('class', targetClass+' player1');
					break;
				case 'O':
					newCompare2.setAttribute('class', targetClass+' player2');
			}
			same2.appendChild(newCompare2);
		} else {
			newCompare2.setAttribute('class', targetClass+' conflict');
			different2.appendChild(newCompare2);
		}
	}
}

function drawCompare3Effect(x,y) {
	x=Math.floor(x);
	y=Math.floor(y);
	if((gridColumns-1<=x)||(x<0)||(gridRows-1<=y)||(y<0))
		return;
	var compare3 = 'E';
	var targetClass='';
	if ((getCurVertex(x, y) == getCurVertex(x, y + 1)) && (getCurVertex(x, y) != '.')) {
		targetClass='vertex'+x+'_'+y+' vertex'+x+'_'+(y+1);
		if (getCurVertex(x, y) == getCurVertex(x + 1, y + 1)) {
			targetClass+=' vertex'+(x+1)+'_'+(y+1);
			compare3 = getCurVertex(x, y);
		}
		if (getCurVertex(x, y) == getCurVertex(x + 1, y)) {
			targetClass+=' vertex'+(x+1)+'_'+y;
			compare3 = getCurVertex(x, y);
		}
	} else if ((getCurVertex(x + 1, y) == getCurVertex(x + 1, y + 1)) && (getCurVertex(x + 1, y) != '.')) {
		targetClass='vertex'+(x+1)+'_'+y+' vertex'+(x+1)+'_'+(y+1);
		if (getCurVertex(x, y) == getCurVertex(x + 1, y)) {
			targetClass+=' vertex'+x+'_'+y;
			compare3 = getCurVertex(x + 1, y);
		}
		if (getCurVertex(x, y + 1) == getCurVertex(x + 1, y)) {
			targetClass+=' vertex'+x+'_'+(y+1);
			compare3 = getCurVertex(x + 1, y);
		}
	}
	if (compare3 != 'E') {
		//console.log('3star');
		newCompare3 = document.createElementNS('http://www.w3.org/2000/svg', 'use');
		newCompare3.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", "#squareMinusFourCircles");
		newCompare3.setAttribute('x', x);
		newCompare3.setAttribute('y', y);
		switch (compare3) {
			case 'X':
				newCompare3.setAttribute('class', targetClass+' player1');
				break;
			case 'O':
				newCompare3.setAttribute('class', targetClass+' player2');
		}
		same3.appendChild(newCompare3);
	}
}

function redrawEffects() {
	different2 = svgBoard.getElementById('different2');
	same2 = svgBoard.getElementById('same2');
	same3 = svgBoard.getElementById('same3');
	while (different2.lastChild) {
		different2.removeChild(different2.lastChild);
	}
	while (same2.lastChild) {
		same2.removeChild(same2.lastChild);
	}
	while (same3.lastChild) {
		same3.removeChild(same3.lastChild);
	}
	for (var x = 0; x < gridColumns - 1; x++) {
		for (var y = 0; y < gridRows; y++) {
			drawHorizontalRectEffect(x,y);
		}
	}
	for (var x = 0; x < gridColumns; x++) {
		for (var y = 0; y < gridRows - 1; y++) {
			drawVerticalRectEffect(x,y);
		}
	}
	for (var x = 0; x < gridColumns - 1; x++) {
		for (var y = 0; y < gridRows - 1; y++) {
			drawCompare3Effect(x,y);
		}
	}
}

function resizeSvgBoard() {
	svgBoard.viewBox.baseVal.width = gridColumns+2*boardMarginWidth;
	svgBoard.viewBox.baseVal.height = gridRows+2*boardMarginWidth;
	svgBoardMargin.setAttribute('width', gridColumns+2*boardMarginWidth);
	svgBoardMargin.setAttribute('height', gridRows+2*boardMarginWidth);
	svgBoardBoard.setAttribute('width', gridColumns);
	svgBoardBoard.setAttribute('height', gridRows);
	while (svgBoardGrid.lastChild) {
		svgBoardGrid.removeChild(svgBoardGrid.lastChild);
	}
	for (var x = 0; x < gridColumns; x++) {
		line = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
		line.setAttribute('x', x - gridLineWidth / 2);
		line.setAttribute('y', -gridLineWidth / 2);
		line.setAttribute('width', gridLineWidth);
		line.setAttribute('height', gridRows - 1 + gridLineWidth);
		line.setAttribute('class', 'grid');
		svgBoardGrid.appendChild(line);
	}
	for (var y = 0; y < gridRows; y++) {
		line = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
		line.setAttribute('x', -gridLineWidth / 2);
		line.setAttribute('y', y - gridLineWidth / 2);
		line.setAttribute('width', gridColumns - 1 + gridLineWidth);
		line.setAttribute('height', gridLineWidth);
		line.setAttribute('class', 'grid');
		svgBoardGrid.appendChild(line);
	}
}

exampleText=`
  9 . . . . . . X X . 9
  8 . . . . O O O X . 8
  7 . . + O O X X . . 7
  6 . . O . X . X . . 6
  5 . . . O X X . . . 5
  4 . . . . O X . . . 4
  3 . . O . O(X)X . . 3
  2 . . . O X X . . . 2
  1 . . . O O X . . . 1
`;
initBoardWithText(exampleText);

//Scoring mode section

var inScoringMode = false;
var territoryMap = [];

function toggleScoringMode() {
    if (inScoringMode) {
        exitScoringMode();
        document.getElementById('toggleScoringButton').textContent = 'Score';
    } else {
        enterScoringMode();
        document.getElementById('toggleScoringButton').textContent = 'Exit Scoring Mode';
    }
}

function enterScoringMode() {
    inScoringMode = true;
    initializeTerritoryMap();
    updateTerritory();
    updateScoringGUI();
    calculateAndDisplayScore();
    // Hide the phantom stone and red X
    svgBoardNextMove.setAttribute('cx', -2);
    svgBoardNextMove.setAttribute('cy', -2);
    svgBoardIllegalMove.style.display = 'none';
}

function exitScoringMode() {
    inScoringMode = false;
    // Remove territory markers
    var territoryLayer = svgBoard.getElementById('territoryLayer');
    if (territoryLayer) {
        svgBoard.removeChild(territoryLayer);
    }
    // Redraw the board
    redrawStones();
    redrawEffects();
    // Reset the scoring status
    scoringStatus.textContent = 'Not in scoring mode.';
}

function initializeTerritoryMap() {
    territoryMap = [];
    for (var y = 0; y < gridRows; y++) {
        territoryMap[y] = [];
        for (var x = 0; x < gridColumns; x++) {
            var stone = getCurVertex(x, y);
            if (stone === 'X' || stone === 'O') {
                territoryMap[y][x] = stone;
            } else {
                territoryMap[y][x] = '?';
            }
        }
    }
}

function updateScoringGUI() {
    // Clear existing territory markers
    var territoryLayer = svgBoard.getElementById('territoryLayer');
    if (!territoryLayer) {
        territoryLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        territoryLayer.setAttribute('id', 'territoryLayer');
        svgBoard.appendChild(territoryLayer);
    }
    while (territoryLayer.firstChild) {
        territoryLayer.removeChild(territoryLayer.firstChild);
    }

    // Draw territory markers
    for (var y = 0; y < gridRows; y++) {
        for (var x = 0; x < gridColumns; x++) {
            var owner = territoryMap[y][x];
            if (owner === 'X' || owner === 'O') {
                var square = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                square.setAttribute('x', x - 0.2);
                square.setAttribute('y', y - 0.2);
                square.setAttribute('width', 0.4);
                square.setAttribute('height', 0.4);
                square.setAttribute('fill', owner === 'X' ? 'black' : 'white');
                square.setAttribute('opacity', 0.5);
                square.setAttribute('stroke', 'blue');
                square.setAttribute('stroke-width', 0.039);
                territoryLayer.appendChild(square);
            }
        }
    }
}

svgBoard.addEventListener('click', function(e) {
    if (!inScoringMode) return;

    var rect = svgBoard.getBoundingClientRect();
    var x = Math.floor((e.clientX - rect.left) / rect.width * gridColumns);
    var y = Math.floor((e.clientY - rect.top) / rect.height * gridRows);

    toggleGroupStatus(x, y);
    updateTerritory();
    updateScoringGUI();
    calculateAndDisplayScore();
});

function toggleGroupStatus(x, y) {
    var stone = getCurVertex(x, y);
    if (stone !== 'X' && stone !== 'O') return;

    var groupId = currentNode.state.groupId[y][x];
    var groupStones = currentNode.state.groupStoneSet[groupId];

    if (groupStones.size > 0) {
        floodFillTerritory(x, y, switchPlayer2(territoryMap[y][x]));
    }
}

function updateTerritory() {
    // Reset all empty spaces to undecided
    for (var y = 0; y < gridRows; y++) {
        for (var x = 0; x < gridColumns; x++) {
            if (getCurVertex(x, y) === '.') {
                territoryMap[y][x] = '?';
            }
        }
    }

    // For each dead group, flood-fill the area to assign territory to the opponent
    for (var y = 0; y < gridRows; y++) {
        for (var x = 0; x < gridColumns; x++) {
            var owner = territoryMap[y][x];
            if (owner === 'X' || owner === 'O') {
                // Check if the group is dead
                if (owner !== getCurVertex(x, y)) {
                    floodFillTerritory(x, y, owner);
                }
            }
        }
    }

    // Assign territory to empty regions surrounded by alive groups
    assignTerritoryToEmptyRegions();
}

function assignTerritoryToEmptyRegions() {
    var visited = Array(gridRows).fill(null).map(() => Array(gridColumns).fill(false));

    for (var y = 0; y < gridRows; y++) {
        for (var x = 0; x < gridColumns; x++) {
            if (getCurVertex(x, y) === '.' && !visited[y][x]) {
                // Start flood fill for this empty region
                var stack = [[x, y]];
                var adjacentStones = new Set();
                var region = [];

                while (stack.length > 0) {
                    var [cx, cy] = stack.pop();
                    if (visited[cy][cx]) continue;
                    visited[cy][cx] = true;
                    region.push([cx, cy]);

                    var directions = [
                        { dx: 1, dy: 0 },
                        { dx: -1, dy: 0 },
                        { dx: 0, dy: 1 },
                        { dx: 0, dy: -1 }
                    ];

                    for (var dir of directions) {
                        var nx = cx + dir.dx;
                        var ny = cy + dir.dy;
                        if (nx >= 0 && nx < gridColumns && ny >= 0 && ny < gridRows) {
                            var neighborStone = territoryMap[ny][nx];
                            if (neighborStone === '?') {
                                if (!visited[ny][nx]) {
                                    stack.push([nx, ny]);
                                }
                            } else if (neighborStone === 'X' || neighborStone === 'O') {
                                adjacentStones.add(neighborStone);
                            }
                        }
                    }
                }

                // Determine owner
                if (adjacentStones.size === 1) {
                    var owner = adjacentStones.values().next().value;
                    // Assign territory
                    for (var [cx, cy] of region) {
                        territoryMap[cy][cx] = owner;
                    }
                } else {
                    // Neutral territory, leave as '?'
                    for (var [cx, cy] of region) {
                        territoryMap[cy][cx] = '?';
                    }
                }
            }
        }
    }
}

function floodFillTerritory(x, y, owner) {
    var stack = [[x, y]];
    var originalOwner = getCurVertex(x, y);
    var opponent = switchPlayer2(originalOwner);
    while (stack.length > 0) {
        var [cx, cy] = stack.pop();

        // Skip if already processed or if it's the opponent's stone
        if (territoryMap[cy][cx] === owner || getCurVertex(cx, cy) === opponent) continue;

        territoryMap[cy][cx] = owner;

        // Check adjacent positions
        var directions = [
            { dx: 1, dy: 0 },
            { dx: -1, dy: 0 },
            { dx: 0, dy: 1 },
            { dx: 0, dy: -1 }
        ];
        for (var dir of directions) {
            var nx = cx + dir.dx;
            var ny = cy + dir.dy;
            if (nx >= 0 && nx < gridColumns && ny >= 0 && ny < gridRows) {
                var neighborStone = getCurVertex(nx, ny);
                if (territoryMap[ny][nx] !== owner && neighborStone !== opponent) {
                    stack.push([nx, ny]);
                }
            }
        }
    }
}

var scoringStatus = document.getElementById('scoringStatus');

function calculateScore() {
    var blackScore = 0;
    var whiteScore = 0;
    for (var y = 0; y < gridRows; y++) {
        for (var x = 0; x < gridColumns; x++) {
            var owner = territoryMap[y][x];
            if (owner === 'X') {
                blackScore += 1;
            } else if (owner === 'O') {
                whiteScore += 1;
            }
        }
    }
    return { black: blackScore, white: whiteScore };
}

function calculateAndDisplayScore() {
    var score = calculateScore();
    scoringStatus.textContent = 'Black: ' + score.black + ' points, White: ' + score.white + ' points.';
}
